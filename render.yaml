# Blueprint de infraestructura como código (IaC) para Render
# Despliegue con 1 clic: Base de datos PostgreSQL + WebApi .NET 10 (Docker) + React SPA (Static Site)
databases:
  - name: realestateapp-postgres
    databaseName: realestateapp
    user: realestate_user
    plan: free

services:
  # 1. Backend REST API (.NET 10 en Docker)
  - type: web
    name: realestateapp-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: realestateapp-postgres
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: SeedInitialData
        value: "true"
      - key: EnableSwaggerInProduction
        value: "true"
      - key: JWTSettings__Key
        generateValue: true
      - key: JWTSettings__Issuer
        value: RealEstateAppWebApi
      - key: JWTSettings__Audience
        value: RealEstateAppClient
      - key: JWTSettings__DurationInMinutes
        value: "1440"

  # 2. Frontend React SPA (Static Site)
  - type: web
    name: realestateapp-client
    runtime: static
    buildCommand: cd src/Presentation/RealEstateApp.ClientApp && npm install && npm run build
    staticPublishPath: src/Presentation/RealEstateApp.ClientApp/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "" # Configurable con la URL generada por realestateapp-api (ej. https://realestateapp-api.onrender.com/api/v1)
