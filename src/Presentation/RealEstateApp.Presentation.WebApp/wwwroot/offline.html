<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin Conexión - RealEstateApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .offline-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.5rem; padding: 2.5rem; text-align: center; max-width: 480px; }
        h1 { font-family: 'Outfit', sans-serif; font-weight: 800; }
    </style>
</head>
<body>
    <div class="offline-card shadow-lg mx-3">
        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
            <i class="bi bi-wifi-off fs-1 text-info"></i>
        </div>
        <h1 class="h3 mb-2">Modo Offline Activo</h1>
        <p class="text-white-50 small mb-4">
            No tienes conexión a internet en este momento. Las funciones en tiempo real requieren estar conectado, pero los recursos de la aplicación han sido guardados en caché local.
        </p>
        <button onclick="window.location.reload()" class="btn btn-info rounded-pill px-4 fw-bold">
            <i class="bi bi-arrow-clockwise me-1"></i> Reintentar Conexión
        </button>
    </div>
</body>
</html>
